# Install at /etc/nginx/sites-available/ptc. Replace leaderboard.example.com.
# This file is included within nginx's http context on Ubuntu.
proxy_cache_path /var/cache/nginx/ptc-media levels=1:2 keys_zone=ptc_media:10m
                 max_size=1g inactive=7d use_temp_path=off;
map $arg_v $ptc_unversioned { "" 1; default 0; }

server {
    listen 80;
    listen [::]:80;
    server_name leaderboard.example.com;
    client_max_body_size 50m;
    gzip on;
    gzip_types application/json text/css application/javascript;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Only public, versioned image responses are cached. Query string is part of key.
    location = /api/media {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache ptc_media;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_bypass $ptc_unversioned;
        proxy_no_cache $ptc_unversioned;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        add_header X-Media-Cache $upstream_cache_status always;
        # Cache-Control/no-store and Set-Cookie are respected; no error caching.
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache off;
        proxy_buffering off;
    }
}
